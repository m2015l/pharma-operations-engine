[project]
name = "solufarma-mod-2"
version = "0.1.0"
description = "Assistente de IA para validação de licitações (Solufarma Módulo 2)"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.13.4",
]

# Ferramentas de desenvolvimento (uv: `uv sync --group dev`).
[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

# O pacote `solufarma_rag` vive em src/ e é encontrado pelo pythonpath abaixo —
# não há [build-system] de propósito, para manter o projeto no modo não-empacotado
# do uv, como o scaffold original.
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
# SIM103: preferimos a sequência de guard clauses em FiltrosBusca.aceita — cada
# filtro fica numa linha própria, legível e fácil de estender pelo time.
ignore = ["SIM103"]
