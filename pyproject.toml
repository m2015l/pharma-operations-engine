[project]
name = "pharma-operations-engine"
version = "0.1.0"
description = "Pipeline de ingestão e RAG sobre o acervo histórico de licitações da Pharma Operations Platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # Núcleo
    "pydantic>=2.13.4",
    "python-dotenv>=1.0",

    # Extração / OCR
    "pymupdf>=1.24",        # renderização de página + texto nativo
    "pillow>=10.0",         # normalização de imagem antes do VLM
    "requests>=2.32",       # chamada ao OpenRouter

    # Indexação (M3)
    "voyageai>=0.3",
    "supabase>=2.0",
    "psycopg[binary]>=3.2",  # acesso direto ao Postgres do Supabase (pgvector)
    "pgvector>=0.3",         # registra o tipo vector no psycopg

    # RAG e agente (M3/M4) — ver ADR-008
    "langchain-core>=1.0",   # Document + BaseRetriever
    "langchain-openai>=0.2", # provedor de embeddings
    "anthropic>=0.40",       # cliente do agente: prompt caching + refusal
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

# Entry points — equivalentes aos alvos do Makefile.
# No Windows sem `make`, use: uv run pharma-extrair ...
[project.scripts]
pharma-extrair = "pharma_ops.cli:main_extrair"
pharma-chunks = "pharma_ops.cli:main_chunks"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# `pharma_rag` é transitório: o port dos módulos de RAG para dentro de
# `src/pharma_ops/` (ADR-007) ainda não foi feito. Sai daqui quando terminar.
packages = ["src/pharma_ops", "src/pharma_rag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
