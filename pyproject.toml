[project]
name = "solufarma-mod-2"
version = "0.1.0"
description = "Pipeline de ingestão e RAG sobre o acervo histórico de licitações da Solufarma"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # Núcleo
    "pydantic>=2.13.4",
    "python-dotenv>=1.0",

    # Extração / OCR
    "pymupdf>=1.24",        # renderização de página + texto nativo
    "pillow>=10.0",         # normalização de imagem antes do VLM
    "requests>=2.32",       # chamada ao OpenRouter

    # Indexação (M3)
    "voyageai>=0.3",
    "supabase>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

# Entry points — equivalentes aos alvos do Makefile.
# No Windows sem `make`, use: uv run solufarma-extrair ...
[project.scripts]
solufarma-extrair = "solufarma.cli:main_extrair"
solufarma-chunks = "solufarma.cli:main_chunks"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/solufarma"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
